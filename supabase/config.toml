# Supabase local development configuration.
# Run `supabase start` to spin up the local stack, then apply migrations with
# `supabase db push` or `supabase migration up`.
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = false
